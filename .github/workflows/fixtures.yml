name: Update suggested fixtures

on:
  schedule:
    - cron: "17 */6 * * *"   # every 6 hours
  workflow_dispatch: {}       # adds a "Run workflow" button

permissions:
  contents: write

jobs:
  fixtures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fetch fixtures
        run: python3 scripts/fetch_fixtures.py frontend/fixtures.json
      - name: Commit if changed
        run: |
          git config user.name "ninety-bot"
          git config user.email "ninety-bot@users.noreply.github.com"
          git add frontend/fixtures.json
          git diff --cached --quiet || git commit -m "Update suggested fixtures"
          git push
